name: intent-recognition ci/cd
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build image
        run: docker build -t intent_recognition:${{ github.sha }} .

        
