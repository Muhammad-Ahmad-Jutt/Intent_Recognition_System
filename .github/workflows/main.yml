name: Build, Train and Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:


# =========================================================
# GITHUB OIDC
# =========================================================

permissions:
  id-token: write
  contents: read


# =========================================================
# GLOBAL ENVIRONMENT
# =========================================================

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

  TRAINER_ROLE: trainer
  PRODUCTION_ROLE: production


# =========================================================
# JOBS
# =========================================================

jobs:

  # =======================================================
  # JOB 1
  # BUILD AND PUSH IMAGE
  # =======================================================

  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      # ---------------------------------------------------
      # Checkout
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------
      # INSPECT GITHUB OIDC TOKEN
      # ---------------------------------------------------

      - name: Inspect GitHub OIDC Token
        id: inspect-oidc
        shell: bash
        run: |

          set -e

          echo "========================================="
          echo "GITHUB OIDC TOKEN INSPECTION"
          echo "========================================="

          echo ""
          echo "Repository:"
          echo "${{ github.repository }}"

          echo ""
          echo "Branch:"
          echo "${{ github.ref_name }}"

          echo ""
          echo "Full ref:"
          echo "${{ github.ref }}"

          echo ""
          echo "GitHub Environment:"
          echo "${{ github.environment }}"

          echo ""
          echo "Actor:"
          echo "${{ github.actor }}"

          echo ""
          echo "Requesting OIDC token..."

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_TOKEN is not available."
            exit 1
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ERROR: ACTIONS_ID_TOKEN_REQUEST_URL is not available."
            exit 1
          fi

          OIDC_RESPONSE=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: Failed to obtain OIDC token."
            echo "Response:"
            echo "$OIDC_RESPONSE"
            exit 1
          fi

          echo ""
          echo "OIDC token received successfully."

          # -------------------------------------------------
          # Split JWT into:
          #
          # HEADER.PAYLOAD.SIGNATURE
          # -------------------------------------------------

          JWT_PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f 2)

          # -------------------------------------------------
          # Add base64 padding
          # -------------------------------------------------

          case $((${#JWT_PAYLOAD} % 4)) in
            2)
              JWT_PAYLOAD="${JWT_PAYLOAD}=="
              ;;
            3)
              JWT_PAYLOAD="${JWT_PAYLOAD}="
              ;;
          esac

          # -------------------------------------------------
          # Decode JWT payload
          # -------------------------------------------------

          DECODED_PAYLOAD=$(echo "$JWT_PAYLOAD" | base64 --decode 2>/dev/null)

          if [ -z "$DECODED_PAYLOAD" ]; then
            echo "ERROR: Could not decode JWT payload."
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "DECODED OIDC JWT CLAIMS"
          echo "========================================="

          echo "$DECODED_PAYLOAD" | jq .

          # -------------------------------------------------
          # Extract important claims
          # -------------------------------------------------

          SUB=$(echo "$DECODED_PAYLOAD" | jq -r '.sub')
          AUD=$(echo "$DECODED_PAYLOAD" | jq -r '.aud')
          ISS=$(echo "$DECODED_PAYLOAD" | jq -r '.iss')
          REPOSITORY=$(echo "$DECODED_PAYLOAD" | jq -r '.repository')
          REF=$(echo "$DECODED_PAYLOAD" | jq -r '.ref')
          REF_TYPE=$(echo "$DECODED_PAYLOAD" | jq -r '.ref_type')
          ACTOR=$(echo "$DECODED_PAYLOAD" | jq -r '.actor')
          WORKFLOW=$(echo "$DECODED_PAYLOAD" | jq -r '.workflow')

          echo ""
          echo "========================================="
          echo "IMPORTANT OIDC CLAIMS"
          echo "========================================="

          echo "sub:"
          echo "$SUB"

          echo ""
          echo "aud:"
          echo "$AUD"

          echo ""
          echo "iss:"
          echo "$ISS"

          echo ""
          echo "repository:"
          echo "$REPOSITORY"

          echo ""
          echo "ref:"
          echo "$REF"

          echo ""
          echo "ref_type:"
          echo "$REF_TYPE"

          echo ""
          echo "actor:"
          echo "$ACTOR"

          echo ""
          echo "workflow:"
          echo "$WORKFLOW"

          echo ""
          echo "========================================="
          echo "EXPECTED AWS IAM TRUST POLICY SUBJECT"
          echo "========================================="

          echo "$SUB"

          echo ""
          echo "Use the EXACT value above for the GitHub OIDC"
          echo "trust policy condition if you are matching sub."


      # ---------------------------------------------------
      # Configure AWS using GitHub OIDC
      # ---------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ---------------------------------------------------
      # Verify AWS identity
      # ---------------------------------------------------

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # ---------------------------------------------------
      # Login to ECR
      # ---------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ---------------------------------------------------
      # Create image name
      # ---------------------------------------------------

      - name: Set image
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |

          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Docker image:"
          echo "$IMAGE"


      # ---------------------------------------------------
      # Build image
      # ---------------------------------------------------

      - name: Build Docker image
        run: |

          docker build \
            -t "${{ steps.image.outputs.image }}" \
            .


      # ---------------------------------------------------
      # Push image
      # ---------------------------------------------------

      - name: Push Docker image
        run: |

          docker push "${{ steps.image.outputs.image }}"


  # =======================================================
  # JOB 2
  # TRAIN MODEL
  # =======================================================

  train:
    name: Train Model

    needs:
      - build

    runs-on: ubuntu-latest

    outputs:
      trainer_instance_id: ${{ steps.find-trainer.outputs.instance_id }}

    steps:

      # ---------------------------------------------------
      # Configure AWS
      # ---------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ---------------------------------------------------
      # Verify AWS identity
      # ---------------------------------------------------

      - name: Verify AWS identity
        run: |

          echo "AWS identity:"
          aws sts get-caller-identity


      # ---------------------------------------------------
      # Find trainer EC2
      # ---------------------------------------------------

      - name: Find trainer instance
        id: find-trainer
        run: |

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=${TRAINER_ROLE}" \
              "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: Trainer instance not found."
            exit 1
          fi

          echo "Trainer instance:"
          echo "$INSTANCE_ID"

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------
      # Start trainer
      # ---------------------------------------------------

      - name: Start trainer
        run: |

          INSTANCE_ID="${{ steps.find-trainer.outputs.instance_id }}"

          echo "Starting trainer..."

          aws ec2 start-instances \
            --instance-ids "$INSTANCE_ID"

          echo "Waiting for trainer to start..."

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          echo "Trainer is running."


      # ---------------------------------------------------
      # Wait for SSM
      # ---------------------------------------------------

      - name: Wait for SSM
        run: |

          INSTANCE_ID="${{ steps.find-trainer.outputs.instance_id }}"

          echo "Waiting for SSM agent..."

          for i in {1..30}; do

            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent is online."
              exit 0
            fi

            sleep 10

          done

          echo "ERROR: SSM agent did not become online."
          exit 1


      # ---------------------------------------------------
      # Send training command
      # ---------------------------------------------------

      - name: Start training
        id: training-command
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |

          INSTANCE_ID="${{ steps.find-trainer.outputs.instance_id }}"

          echo "========================================="
          echo "TRAINING CONFIGURATION"
          echo "========================================="

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""
          echo "Trainer Instance:"
          echo "$INSTANCE_ID"

          echo ""
          echo "Training Image:"
          echo "$IMAGE"

          echo ""
          echo "AWS identity:"
          aws sts get-caller-identity

          echo ""
          echo "Sending training command..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions ML training" \
            --parameters 'commands=[
              "set -e",
              "echo \"Starting training deployment...\"",
              "aws ecr get-login-password --region '"${AWS_REGION}"' | docker login --username AWS --password-stdin '"$(aws sts get-caller-identity --query Account --output text)"'.dkr.ecr.'"${AWS_REGION}"'.amazonaws.com",
              "docker pull '"${IMAGE}"'",
              "docker rm -f intent-recognition-training 2>/dev/null || true",
              "docker run --name intent-recognition-training --env-file /etc/app/app_env.env '"${IMAGE}"'"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo ""
          echo "SSM command ID:"
          echo "$COMMAND_ID"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------
      # Wait for training
      # ---------------------------------------------------

      - name: Wait for training
        run: |

          INSTANCE_ID="${{ steps.find-trainer.outputs.instance_id }}"
          COMMAND_ID="${{ steps.training-command.outputs.command_id }}"

          echo "Waiting for training to finish..."

          while true; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "Training status: $STATUS"

            case "$STATUS" in

              Success)

                echo "========================================="
                echo "TRAINING COMPLETED SUCCESSFULLY"
                echo "========================================="

                echo ""
                echo "Training output:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;


              Failed|Cancelled|TimedOut|Cancelling)

                echo "========================================="
                echo "TRAINING FAILED"
                echo "========================================="

                echo ""
                echo "Standard output:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                echo ""
                echo "Standard error:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text

                exit 1
                ;;


              Pending|InProgress|Delayed)

                sleep 15
                ;;


              *)

                echo "Unknown status: $STATUS"
                sleep 10
                ;;

            esac

          done


  # =======================================================
  # JOB 3
  # DEPLOY PRODUCTION
  # =======================================================

  deploy-production:
    name: Deploy Production

    needs:
      - build
      - train

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------
      # Configure AWS
      # ---------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ---------------------------------------------------
      # Verify AWS identity
      # ---------------------------------------------------

      - name: Verify AWS identity
        run: |

          aws sts get-caller-identity


      # ---------------------------------------------------
      # Find trainer
      # ---------------------------------------------------

      - name: Find trainer instance
        id: trainer
        run: |

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=${TRAINER_ROLE}" \
              "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: Trainer instance not found."
            exit 1
          fi

          echo "TRAINER_INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

          echo "Trainer instance:"
          echo "$INSTANCE_ID"


      # ---------------------------------------------------
      # Stop trainer
      # ---------------------------------------------------

      - name: Stop trainer
        run: |

          echo "Stopping trainer..."

          aws ec2 stop-instances \
            --instance-ids "$TRAINER_INSTANCE_ID"

          aws ec2 wait instance-stopped \
            --instance-ids "$TRAINER_INSTANCE_ID"

          echo "Trainer stopped."


      # ---------------------------------------------------
      # Find production instance
      # ---------------------------------------------------

      - name: Find production instance
        id: production
        run: |

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Role,Values=${PRODUCTION_ROLE}" \
              "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "ERROR: Production instance not found."
            exit 1
          fi

          echo "PRODUCTION_INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

          echo "Production instance:"
          echo "$INSTANCE_ID"


      # ---------------------------------------------------
      # Start production
      # ---------------------------------------------------

      - name: Start production
        run: |

          echo "Starting production..."

          aws ec2 start-instances \
            --instance-ids "$PRODUCTION_INSTANCE_ID"

          echo "Waiting for production to start..."

          aws ec2 wait instance-running \
            --instance-ids "$PRODUCTION_INSTANCE_ID"

          echo "Production is running."


      # ---------------------------------------------------
      # Wait for production SSM
      # ---------------------------------------------------

      - name: Wait for production SSM
        run: |

          echo "Waiting for production SSM..."

          for i in {1..30}; do

            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$PRODUCTION_INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Online" ]; then
              echo "Production SSM is online."
              exit 0
            fi

            sleep 10

          done

          echo "ERROR: Production SSM did not become online."
          exit 1


      # ---------------------------------------------------
      # Deploy API
      # ---------------------------------------------------

      - name: Deploy production container
        id: production-command
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |

          echo "========================================="
          echo "PRODUCTION DEPLOYMENT"
          echo "========================================="

          echo "AWS Region:"
          echo "$AWS_REGION"

          echo ""
          echo "Production Instance:"
          echo "$PRODUCTION_INSTANCE_ID"

          echo ""
          echo "Production Image:"
          echo "$IMAGE"

          echo ""
          echo "AWS identity:"
          aws sts get-caller-identity

          echo ""
          echo "Sending production deployment command..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$PRODUCTION_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions production deployment" \
            --parameters 'commands=[
              "set -e",
              "echo \"Starting production deployment...\"",
              "aws ecr get-login-password --region '"${AWS_REGION}"' | docker login --username AWS --password-stdin '"$(aws sts get-caller-identity --query Account --output text)"'.dkr.ecr.'"${AWS_REGION}"'.amazonaws.com",
              "docker pull '"${IMAGE}"'",
              "docker rm -f intent-recognition-api 2>/dev/null || true",
              "docker run -d --restart unless-stopped --name intent-recognition-api --env-file /etc/app/app_env.env -p 5000:5000 '"${IMAGE}"'",
              "sleep 5",
              "docker ps",
              "docker logs --tail 50 intent-recognition-api"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo ""
          echo "Production SSM command:"
          echo "$COMMAND_ID"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"


      # ---------------------------------------------------
      # Check production deployment
      # ---------------------------------------------------

      - name: Check production deployment
        run: |

          COMMAND_ID="${{ steps.production-command.outputs.command_id }}"

          echo "Waiting for production deployment..."

          while true; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$PRODUCTION_INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "Deployment status: $STATUS"

            case "$STATUS" in

              Success)

                echo "========================================="
                echo "PRODUCTION DEPLOYMENT SUCCESSFUL"
                echo "========================================="

                echo ""
                echo "Deployment output:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$PRODUCTION_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                exit 0
                ;;


              Failed|Cancelled|TimedOut|Cancelling)

                echo "========================================="
                echo "PRODUCTION DEPLOYMENT FAILED"
                echo "========================================="

                echo ""
                echo "Standard output:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$PRODUCTION_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                echo ""
                echo "Standard error:"

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$PRODUCTION_INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text

                exit 1
                ;;


              Pending|InProgress|Delayed)

                sleep 10
                ;;


              *)

                echo "Unknown status: $STATUS"
                sleep 10
                ;;

            esac

          done
